[package]
name = "fpmedia-web-leptos"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Leptos media elements (<Video>, later <Audio>) over the fpmedia-web engine"
readme = "README.md"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["thumbs"]
thumbs = ["fpmedia-web/thumbs"]
# Opt-in H.265 — see `fpmedia-web` feature `hevc`.
hevc = ["fpmedia-web/hevc"]

[dependencies]
leptos = { workspace = true }
leptos-use = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "DomRect",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "AudioContext",
    "BaseAudioContext",
    "Performance",
    "Blob",
    "Response",
    "console",
] }
fpmedia-web = { path = "../engine", features = ["webcodecs"] }
