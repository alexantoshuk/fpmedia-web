[target.wasm32-unknown-unknown]
# `--cfg`: web-sys gates WebCodecs (VideoDecoder, VideoFrame, …) behind it.
# `-zstack-size`: 8 MiB linear-memory stack (default 1 MiB). The unoptimized
# `DemoPlayer` view frame overflows the default → `memory access out of
# bounds` on load in `trunk serve` (release build is fine).
rustflags = ["--cfg=web_sys_unstable_apis", "-C", "link-arg=-zstack-size=8388608"]
