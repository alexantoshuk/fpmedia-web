[package]
name = "video"
version = "0.1.0"
edition = "2024"
description = "Leptos <Video> element over the webmedia engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true }
leptos-use = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "AudioContext",
    "BaseAudioContext",
    "Performance",
] }
webmedia = { path = "../media", features = ["webcodecs"] }
