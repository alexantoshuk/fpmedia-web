[package]
name = "fpmedia-web-demo-player"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true, features = ["csr"] }
leptos_meta = { workspace = true }
leptos-use = { workspace = true }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "HtmlInputElement",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlDivElement",
    "CanvasRenderingContext2d",
    "Element",
    "Document",
    "DomRect",
    "File",
    "FileList",
    "Blob",
    "KeyboardEvent",
    "Window",
    "Location",
    "Screen",
    "ScreenOrientation",
    "OrientationLockType",
    "OrientationType",
] }
fpmedia-web-components = { path = "../components", version = "0.1.0-alpha.1" }
