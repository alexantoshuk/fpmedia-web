[package]
name = "webmedia"
version = "0.1.0"
edition = "2024"
description = "Frame-accurate media engine (demux + player API)"
publish = false

[features]
default = []
webcodecs = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]

[dependencies]
re_mp4 = { workspace = true }
thiserror = { workspace = true }
lru = { workspace = true }

wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Window",
    "Performance",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "CanvasRenderingContext2d",
    "VideoDecoder",
    "VideoDecoderInit",
    "VideoDecoderConfig",
    "VideoDecoderSupport",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkType",
    "VideoFrame",
    "HardwareAcceleration",
    "Blob",
    "console",
] }
