[workspace]
resolver = "2"
members = [
    "engine",
    "components",
    "timecode",
    "demo-player",
]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexantoshuk/fpmedia-web"
homepage = "https://github.com/alexantoshuk/fpmedia-web"
edition = "2024"

[workspace.lints.clippy]
# Production panics kill the whole wasm instance (player, AudioContext) until reload.
# Tests are exempt via `clippy.toml` `allow-unwrap-in-tests`.
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.dependencies]
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos-use = { version = "0.19", default-features = false, features = [
    "use_resize_observer",
    "use_raf_fn",
    "use_event_listener",
    "use_element_size",
    "use_timeout_fn",
    "use_throttle_fn",
    "use_clipboard",
    "use_document_visibility",
] }
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
log = "0.4.33"
thiserror = "2.0.19"
lru = "0.12"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
bytes = "1"
wasm-bindgen = "0.2.126"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"
# Upstream main: QT SoundDescriptionV2 (#35) + PCM chunk-coalesce (#38 / #37).
# crates.io 0.5.1 predates both — switch to a published version when one ships.
# fpmedia-web ignores non-`mp4a` audio; coalesce is still required so long PCM masters open.
re_mp4 = { git = "https://github.com/rerun-io/re_mp4", rev = "73e38d9160d3ae5ce5521be3c4875a59c2a26b35" }
