[workspace]
resolver = "2"
members = ["media", "video", "app", "frontend", "server"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.dependencies]
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8" }
leptos-use = { version = "0.19", default-features = false, features = [
    "use_resize_observer",
    "use_raf_fn",
    "use_event_listener",
    "use_element_size",
    "use_timeout_fn",
    "use_throttle_fn",
] }
axum = "0.8.9"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
log = "0.4.33"
simple_logger = "5.2.0"
thiserror = "2.0.19"
lru = "0.12"
tokio = { version = "1.53", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6.11", features = ["full"] }
wasm-bindgen = "0.2.126"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"
# Temporary: QT SoundDescriptionV2 / wave+esds (#35) until next crates.io release.
# https://github.com/rerun-io/re_mp4/issues/32
re_mp4 = { git = "https://github.com/rerun-io/re_mp4", rev = "aa5be9b10686f9cd1834cc8c8c75f6adbb7cf468" }

[[workspace.metadata.leptos]]
name = "webmedia"
bin-package = "server"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/input.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = []
bin-default-features = false
lib-features = []
lib-default-features = false
