[package]
name = "media_components"
version = "0.1.0"
edition = "2024"
description = "Leptos media elements (<Video>, later <Audio>) over the webmedia engine"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["thumbs"]
thumbs = ["webmedia/thumbs"]
# Opt-in H.265 — see `webmedia` feature `hevc`.
hevc = ["webmedia/hevc"]

[dependencies]
leptos = { workspace = true }
leptos-use = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "AudioContext",
    "BaseAudioContext",
    "Performance",
    "Blob",
    "Response",
    "console",
] }
webmedia = { path = "../media", features = ["webcodecs"] }
