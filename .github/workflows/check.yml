# CONTRIBUTING gates via `scripts/check.sh` (fmt / Clippy incl. wasm / tests).
# Local: `.githooks/pre-push` → same script (`git config core.hooksPath .githooks`).
# Toolchain: `rust-toolchain.toml` (dtolnay/rust-toolchain reads it).
# E2e and Trunk site build stay out of this job — see pages.yml + local e2e.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          workspaces: ". -> target"

      - name: gates
        run: bash scripts/check.sh
