# Deploy CSR static demo to GitHub Pages (Trunk build — no Axum).
#
# Repo Settings → Pages → Source: GitHub Actions.
# Repo must be public (or Pro) for Pages.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          workspaces: ". -> target"

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # Tailwind v4 CLI: Trunk auto-downloads via `[tools] tailwindcss` + `rel="tailwind-css"`.

      - name: Build site (Trunk)
        working-directory: demo-player
        run: trunk build --release --public-url /fpmedia-web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-player/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
