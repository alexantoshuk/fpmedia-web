# Deploy CSR static demo to GitHub Pages (Blob open only — no /proxy).
#
# Repo Settings → Pages → Source: GitHub Actions.
# Repo must be public (or Pro) for Pages.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Project site: https://<user>.github.io/fpmedia-web/
  FPMEDIA_SITE_BASE: /fpmedia-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install cargo-leptos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos

      # style/input.css uses Tailwind v4 `@import "tailwindcss"` — v3 CLI fails
      # looking for node_modules and cargo-leptos then reports "Failed to build".
      - name: Install Tailwind CSS v4 CLI
        run: |
          curl -fsSL -o tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x tailwindcss
          sudo mv tailwindcss /usr/local/bin/tailwindcss
          tailwindcss --help | head -n 2

      - name: Build site (static_host)
        run: cargo leptos build --release --lib-features static_host

      - name: Export index.html
        run: cargo run --release -p server --bin export_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
